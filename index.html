<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Live Karaoke Paris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Karla:wght@400;600;700&family=Lexend:wght@600;700&display=swap">
<style>
/* Layout: one narrow phone column — logo, sticky search + sort switch + genre chips, list grouped by letter (titles) or by artist. Single dark "night at the bar" look by choice, tuned to the lavender logo. */
:root{
  --night:#141a33;      /* page ground */
  --deep:#0e1328;       /* sticky bar */
  --card:#222a4a;       /* chips / input */
  --ink:#f3f0fb;        /* main text */
  --muted:#a6a9c8;      /* artist names */
  --lilac:#c4b5fd;      /* logo lavender, accent */
  --violet:#a78bfa;     /* genre tags */
  --line:rgba(243,240,251,.09);
  --head:"Lexend","Arial Black",system-ui,sans-serif;
  --script:"Yellowtail","Brush Script MT",cursive;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html{background:var(--night)}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:560px;margin:0 auto}

header{position:relative;padding-block:44px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{width:min(300px,78%);height:auto;display:block;margin-inline:auto}
.intro{color:var(--muted);margin:0;max-width:36ch}
.lang{position:absolute;top:10px;right:0;display:flex;gap:6px}
.lang button{display:flex;align-items:center;gap:6px;background:transparent;border:1.5px solid var(--card);border-radius:999px;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:4px 9px 4px 5px;cursor:pointer}
.lang button[aria-pressed="true"]{border-color:var(--lilac);color:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.lang svg{width:22px;height:15px;border-radius:3px;display:block}
.intro b{color:var(--ink);font-weight:600}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--deep);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.bar .inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
#q{width:100%;box-sizing:border-box;background:var(--card);border:1.5px solid transparent;border-radius:999px;color:var(--ink);font:inherit;font-size:16px;padding:12px 44px 12px 42px;outline:none}
#q::placeholder{color:var(--muted)}
#q:focus{border-color:var(--lilac)}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:6px 10px;cursor:pointer}

.sort{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:3px}
.sort button{background:none;border:0;border-radius:999px;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:8px 10px;cursor:pointer}
.sort button[aria-pressed="true"]{background:var(--ink);color:var(--deep)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:transparent;color:var(--ink);border:1.5px solid var(--card);border-radius:999px;font:inherit;font-size:14px;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:var(--deep)}
.chip[aria-pressed="true"] small{color:var(--deep)}
.chip:focus-visible,#clear:focus-visible,.sort button:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}

.count{color:var(--muted);font-size:13px;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.letter{font-family:var(--head);font-weight:700;color:var(--lilac);font-size:1.15rem;padding-block:18px 4px;border-bottom:2px solid var(--lilac);width:1.6em}
.artisthead{font-family:var(--head);font-weight:600;color:var(--lilac);font-size:1.05rem;padding-block:18px 2px}
ul{list-style:none;margin:0;padding:0}
li{padding-block:11px;border-bottom:1px solid var(--line)}
li .t{min-width:0}
li a.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;color:inherit;text-decoration:none}
li a.row:active{opacity:.6}
li a.row:focus-visible{outline:2px solid var(--lilac);outline-offset:3px;border-radius:4px}
li .right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
li .lyr{font-size:12px;font-weight:700;color:var(--lilac);white-space:nowrap}
li .title{font-weight:700;font-size:1.02rem;display:block}
li .artist{color:var(--muted);font-size:.9rem}
li .tag{flex:0 0 auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);font-weight:600;text-align:right}
.byartist li{padding-block:9px}
.empty{color:var(--muted);padding-block:30px;text-align:center}
footer{margin-top:32px;color:var(--muted);font-size:14px;text-align:center}
footer .sig{font-family:var(--script);color:var(--lilac);font-size:1.6rem;display:block;margin-bottom:4px}
</style>

const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const key=t=>norm(t).replace(/^\(sittin' on\) /,"").replace(/^the /,"").replace(/[^a-z0-9 &]/g,"").trim();
const songs=S.map(([t,a,g,c,sing,x,tf,af])=>({t,a,g,c,sing,x:x||[],tf,af,s:norm(t+" "+a+" "+(tf||"")+" "+(af||""))}));
const cmp=(x,y)=>x.localeCompare(y,"fr");

let genre="all",mode="title";
try{const g=localStorage.getItem("lkp-genre");if(g&&(g==="all"||CATS.includes(g)))genre=g;const m=localStorage.getItem("lkp-mode");if(m==="artist")mode=m}catch(e){}
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

const chips=document.getElementById("chips");
function chip(id,label,n){
  const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.g=id;
  b.dataset.n=n;
  b.addEventListener("click",()=>{genre=id;save("lkp-genre",id);render()});
  chips.appendChild(b);
}
chip("all","Tout",songs.length);
CATS.forEach(id=>chip(id,"",songs.filter(s=>inCat(s,id)).length));

document.querySelectorAll(".sort button").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.m;save("lkp-mode",mode);render()}));
const q=document.getElementById("q"),clear=document.getElementById("clear");
q.addEventListener("input",render);
clear.addEventListener("click",()=>{q.value="";q.focus();render()});
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const tag=s=>s.g===genre?"":'<span class="tag">'+T[lang].G[s.g]+"</span>";
const lyr=s=>"https://www.google.com/search?q="+encodeURIComponent(s.dt+" "+s.dr.replace(/^(Traditionnel|Standard jazz|Grease|High School Musical)$/,m=>m==="Traditionnel"?"":m==="Standard jazz"?"jazz standard":m)+(lang==="fr"&&s.tf?" paroles":" lyrics"));
const row=(s,inner)=>'<li><a class="row" href="'+lyr(s)+'" target="_blank" rel="noopener">'+inner+'<span class="right">'+tag(s)+'<span class="lyr">'+T[lang].lyrics+'</span></span></a></li>';

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;save("lkp-lang",lang);render()}));
function render(){
  const L_=T[lang];document.documentElement.lang=lang;
  for(const s of songs){const fr=lang==="fr"&&s.tf;s.dt=fr?s.tf:s.t;s.dr=fr?s.af:s.a;s.da=artistName(s.dr);s.k=key(s.dt);s.ak=key(s.da)}
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.getElementById("intro").innerHTML=L_.intro;document.getElementById("sig").textContent=L_.sig;
  q.placeholder=L_.search;q.setAttribute("aria-label",L_.searchL);clear.setAttribute("aria-label",L_.clear);
  document.getElementById("byTitle").textContent=L_.byTitle;document.getElementById("byArtist").textContent=L_.byArtist;
  chips.querySelectorAll(".chip").forEach(c=>{c.innerHTML=(c.dataset.g==="all"?L_.all:L_.C[c.dataset.g])+"<small>"+c.dataset.n+"</small>"});
  chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.g===genre));
  document.querySelectorAll(".sort button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));
  const term=norm(q.value.trim());clear.hidden=!term;
  const res=songs.filter(s=>inCat(s,genre)&&(!term||s.s.includes(term)));
  document.getElementById("count").textContent=res.length+(res.length>1?L_.many:L_.one);
  const list=document.getElementById("list");
  list.className=mode==="artist"?"byartist":"";
  if(!res.length){list.innerHTML='<p class="empty">'+L_.empty+'</p>';return}
  let html="",cur=null,open=false;
  if(mode==="title"){
    res.sort((x,y)=>cmp(x.k,y.k)||cmp(x.ak,y.ak));
    for(const s of res){
      const c=s.k[0],L=/[0-9]/.test(c)?"#":c.toUpperCase();
      if(L!==cur){if(open)html+="</ul>";html+='<div class="letter">'+L+"</div><ul>";cur=L;open=true}
      html+=row(s,'<span class="t"><span class="title">'+esc(s.dt)+'</span><span class="artist">'+esc(s.da)+"</span></span>");
    }
  }else{
    res.sort((x,y)=>cmp(x.ak,y.ak)||cmp(x.k,y.k));
    for(const s of res){
      if(s.da!==cur){if(open)html+="</ul>";html+='<div class="artisthead">'+esc(s.da)+"</div><ul>";cur=s.da;open=true}
      html+=row(s,'<span class="t"><span class="title">'+esc(s.dt)+"</span></span>");
    }
  }
  list.innerHTML=html+"</ul>";
}
render();
</script>
