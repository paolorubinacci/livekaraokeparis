<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="band-icon-v2.png"><link rel="icon" href="band-icon-v2.png"><meta name="apple-mobile-web-app-title" content="LK Band"><meta name="theme-color" content="#141a33">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Live Karaoke Band</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Josefin+Sans:wght@400;600;700&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: stage-first single column in the same "night at the bar" navy + lavender world as the public song list.
   Violet hero with the white logo on the setlist; sticky header, 4-bar chord rows, fixed transport bar. Single dark look by choice (stage use). */
:root{
  --bg:#141a33; --deep:#0e1328; --surface:#1a2141; --surface2:#222a4a; --line:#323b66;
  --fg:#f3f0fb; --muted:#a6a9c8; --accent:#ffbf73; --accent-ink:#0e1328; --violet:#a78bfa; --brand:#7c5ce6; --danger:#ff8a8a;
  --sec-intro:#a6a9c8; --sec-verse:#7cc4f5; --sec-pre:#c4b5fd; --sec-chorus:#ffc46b; --sec-bridge:#7fdcb0; --sec-solo:#f59ac0; --sec-outro:#a6a9c8;
  --now:#ffc46b;
  --f-chord:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-head:"Josefin Sans","Century Gothic",system-ui,sans-serif;
  --f-ui:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}

/* hero */
.hero{margin-top:14px;border-radius:22px;padding:30px 20px 24px;background:
  radial-gradient(110% 85% at 85% 8%,rgba(196,181,253,.35),transparent 55%),
  linear-gradient(145deg,#231c5e 0%,#3a2a9a 42%,#5a40cc 78%,#7a5ee6 100%);
  display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
.hero img{width:min(300px,80%);height:auto;display:block;filter:drop-shadow(0 6px 22px rgba(255,170,80,.28))}
.hero .tagline{font-family:var(--f-head);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c4b5fd}
.hero .newbtn{position:absolute;top:12px;right:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,19,40,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:58px;padding-block:6px}
.mark{width:38px;height:38px;border-radius:11px;flex:0 0 auto;background:linear-gradient(145deg,#2b2370,#5a40cc);display:flex;align-items:center;justify-content:center}
.mark img{width:24px;height:auto;display:block}
.top .ttl{flex:1;min-width:0}
.top .ttl .t{font-family:var(--f-head);font-weight:700;font-size:18px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top .ttl .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:38px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);font-weight:600;font-size:14px;padding:0 6px;gap:6px}
.ib:active{background:var(--surface2)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{min-height:40px;border-radius:999px;padding:0 16px;font-weight:700;font-size:15px;background:var(--surface2);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.white{background:#fff;color:#3b2596;border-color:transparent}
.btn.warn{color:var(--danger)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13.5px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* setlist */
.eyebrow{font-family:var(--f-head);font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.setlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.setlist li{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.setlist .n{font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--muted);width:22px;text-align:right;font-variant-numeric:tabular-nums}
.setlist .main{flex:1;min-width:0;text-align:left}
.setlist .st{font-weight:700;font-size:17px;line-height:1.25}
.setlist .sa{font-size:14px;color:var(--muted)}
.keypill{font-family:var(--f-chord);font-weight:700;font-size:21px;min-width:52px;height:38px;padding:0 8px;border-radius:10px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center}
.keypill.moved{background:var(--accent);color:var(--accent-ink)}
.meta{font-size:12px;max-width:92px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.reorder{display:flex;flex-direction:column}
.reorder .ib{height:30px;min-width:34px}
.listhead{margin-block:22px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.foot{display:flex;gap:10px;flex-wrap:wrap;padding-block:22px 10px}
.small{font-size:13px;color:var(--muted)}

/* song view */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--surface2);padding:3px;border-radius:999px;margin-block:12px 12px}
.tabs button{height:36px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--deep)}
.keybar{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.keybar .lab{font-size:11px;font-family:var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.keybar .lab b{display:block;font-family:var(--f-chord);font-size:28px;letter-spacing:0;color:var(--fg);line-height:1;text-transform:none}
.keys{display:flex;gap:6px;overflow-x:auto;padding-block:6px;scrollbar-width:none;flex:1;min-width:0;-webkit-overflow-scrolling:touch}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:46px;height:40px;border-radius:10px;border:1.5px solid var(--line);font-family:var(--f-chord);font-weight:600;font-size:19px;position:relative}
.keys button.orig::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--muted)}
.keys button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.keys button[aria-pressed="true"]::after{background:var(--accent-ink)}
.shiftinfo{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shiftinfo .sep{opacity:.5}

.sec{margin-block:14px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 24%,var(--line));overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;text-align:left}
.tag{font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--c);text-transform:uppercase}
.rep{font-family:var(--f-chord);font-weight:700;font-size:15px;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.pass{font-family:var(--f-chord);font-weight:700;font-size:15px;color:var(--now)}
.sec-h .sp{flex:1}
.lyr-hint{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.lyr-hint .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.lyr-hint svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.sec.open .lyr-hint svg{transform:rotate(180deg)}
.rowsw{display:grid;gap:6px;padding:2px 8px 12px}
.rowsw:empty{display:none}
.sec:has(.rowsw:empty) .sec-h{padding-bottom:4px}
.sec:has(.rowsw:empty) .snote,.sec:has(.rowsw:empty) .cue{padding-bottom:10px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.bar{min-height:62px;border-right:2px solid rgba(243,240,251,.55);display:flex;align-items:center;justify-content:space-around;gap:2px;padding:0 3px;position:relative;border-radius:2px;min-width:0}
.bar.lb{border-left:2px solid rgba(243,240,251,.55)}
.bar.blank{border:0!important;background:none}
.bar.blank.editable{outline:1px dashed var(--line);outline-offset:-6px}
.volta{position:absolute;top:3px;left:5px;right:8px;height:13px;border-top:1.5px solid var(--muted);border-left:1.5px solid var(--muted);font-family:var(--f-ui);font-size:11px;font-weight:700;line-height:13px;padding-left:3px;color:var(--muted)}
.pct2{position:absolute;right:-17px;top:50%;transform:translateY(-50%);width:32px;z-index:1}
.pct2 svg{width:32px;height:24px;display:block;fill:var(--muted);stroke:var(--muted);stroke-width:3.2;stroke-linecap:round}
.cue{padding:0 14px 8px;font-size:15.5px;font-style:italic;color:var(--fg);opacity:.88;line-height:1.35}
.bar.first{border-left-width:4px!important}
.bar.now{background:color-mix(in srgb,var(--now) 24%,transparent)}
.bar.now::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--now);border-radius:2px}
.ch{font-family:var(--f-chord);font-weight:600;line-height:1;white-space:nowrap;display:inline-flex;align-items:baseline;min-width:0}
.ch .r{font-weight:700}
.ch .acc{font-size:.62em;position:relative;top:-.55em;margin-left:1px}
.ch .q{font-size:.6em;position:relative;top:-.62em;margin-left:1px;font-weight:600}
.ch.long{letter-spacing:-.02em}
.ch.long .q{font-size:.52em}
.ch .b{font-size:.64em;margin-left:1px;color:var(--muted);font-weight:600}
.bar[data-n="1"] .ch{font-size:30px}
.bar[data-n="2"] .ch{font-size:23px}
.bar[data-n="3"] .ch{font-size:17px}
.bar[data-n="4"] .ch{font-size:15px}
.bar[data-n="1"] .ch.long{font-size:25px}
.bar[data-n="2"] .ch.long{font-size:18px}
.bar .pct{font-family:var(--f-chord);font-size:28px;color:var(--muted);font-weight:600}
.nc{font-family:var(--f-chord);font-weight:600;font-size:18px;color:var(--muted)}
.lyr{border-top:1px solid color-mix(in srgb,var(--c) 22%,var(--line));padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.lyr .txt{white-space:pre-wrap;font-size:19px;line-height:1.5;max-width:65ch}
.lyr .empty{color:var(--muted);font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lyr textarea,.fld textarea{width:100%;min-height:120px;border-radius:12px;border:1.5px solid var(--line);background:var(--deep);padding:10px 12px;font-size:16px;line-height:1.45;resize:vertical}
.fulllyr{padding-block:6px 30px;display:flex;flex-direction:column;gap:14px}
.fulllyr .txt{white-space:pre-wrap;font-size:20px;line-height:1.55;max-width:65ch}
.emptybox{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.songnotes{font-size:15px;color:var(--fg);margin-top:8px;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;line-height:1.5}
.songnotes .lbl{margin-bottom:6px}
.pad-bottom{height:calc(120px + env(safe-area-inset-bottom,0px))}

.sec-h .fromhere{width:34px;height:34px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 40%,var(--line));color:var(--c);display:inline-flex;align-items:center;justify-content:center}
.sec-h .fromhere svg{width:13px;height:13px}
.snote{margin:0 14px 8px;font-size:13.5px;font-weight:700;color:var(--c);display:flex;gap:6px;align-items:baseline}
.snote::before{content:"♪";opacity:.8}
.formv{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.fstep{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--c) 26%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.fnum{font-family:var(--f-chord);font-weight:700;font-size:20px;color:var(--muted);min-width:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.fbody{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.fhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbars{font-size:12.5px;color:var(--muted);margin-left:auto}
.fcue{font-style:italic;font-size:16px;line-height:1.35}
.fnote{font-size:14px;font-weight:700;color:var(--c)}
.fnote::before{content:"♪ ";opacity:.8}
/* listen */
.listen{display:flex;flex-direction:column;gap:14px;padding-block:4px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-family:var(--f-head);font-size:15px;font-weight:600;letter-spacing:.02em}
.card p{margin:0}
.linkline{font-size:13px;color:var(--muted);word-break:break-all}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--deep);padding:0 14px;font-size:16px}
.player{display:flex;align-items:center;gap:12px}
.pbtn{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pbtn svg{width:22px;height:22px;fill:currentColor}
.ptrack{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ptrack input[type=range]{width:100%;accent-color:var(--accent)}
.ptime{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* publish bar (editor only) */
.pubbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--fg);color:var(--deep);border-radius:16px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 8px 28px rgba(0,0,0,.4);font-size:14px;max-width:836px;margin:0 auto}
.pubbar .btn{background:transparent;border-color:rgba(14,19,40,.25);color:var(--deep)}
.pubbar .btn.pri{background:var(--brand);color:#fff;border-color:transparent}
.listen-hero{align-items:center;text-align:center;padding:28px 16px}
.lh-t{font-family:var(--f-head);font-weight:700;font-size:22px}
.btn.big{min-height:54px;font-size:17px;padding:0 26px}
/* visual chart editor */
.edbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1.5px solid var(--accent);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.linkt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-size:14px;line-height:1.3}
.linkt .box{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink);font-size:14px}
.linkt[aria-pressed="true"] .box{background:var(--accent)}
.linkt[aria-pressed="false"]{background:none;opacity:.8}
.loopbox{flex-basis:100%;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.loopbox input{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--deep);padding:0 12px;font-family:var(--f-chord);font-size:24px;font-weight:600;width:100%}
.bar.editable{cursor:pointer}
.bar.editable:active{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.bar.sel{outline:2px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.addsec{width:100%;border:1.5px dashed var(--line);border-radius:14px;min-height:48px;color:var(--muted);font-weight:700;margin-top:6px}
.sheet.edsheet{max-height:58%;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.sheet.edsheet .wrap{gap:10px;padding-block:12px}

.bar.editable{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bar.msel{outline:2px dashed var(--accent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:52;background:var(--surface);border-top:1.5px solid var(--accent);box-shadow:0 -10px 30px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
.selbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px}
.trask{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.wrapnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.sheet.edsheet{max-height:48%}
@media (min-width:900px),(orientation:landscape) and (min-width:640px){
 .sheet.edsheet{left:auto;top:0;bottom:0;width:min(400px,40vw);max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.45)}
 .sheet.edsheet .wrap{max-width:none;padding-inline:16px}
 body.edside #app{padding-right:min(400px,40vw)}
 body.edside .transport{right:min(400px,40vw)}body.edside .pubbar{right:calc(min(400px,40vw) + 12px)}
}
.shead{display:flex;align-items:center;gap:6px}
.shead .stitle{flex:1;min-width:0}
.lbl{font-family:var(--f-head);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pick button,.qual button{height:40px;border-radius:10px;border:1.5px solid var(--line);font-family:var(--f-chord);font-weight:600;font-size:19px}
.qual{display:flex;flex-wrap:wrap;gap:6px}
.qual button{padding:0 10px;min-width:48px;font-size:17px}
.qual.txt button{font-family:var(--f-head);font-size:12px;letter-spacing:.06em;height:36px}
.pick button[aria-pressed="true"],.qual button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipc{min-width:68px;height:52px;border-radius:12px;border:1.5px solid var(--line);font-family:var(--f-chord);font-size:26px;font-weight:700;padding:0 12px;display:inline-flex;align-items:center;justify-content:center}
.chipc .ch{font-size:26px}
.chipc[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
.chipc.add{color:var(--muted);border-style:dashed;min-width:52px}
/* transport */
.transport{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--deep);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.transport .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.play{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,var(--brand),var(--violet));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.play svg{width:24px;height:24px;fill:currentColor}
.bpm{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:14px;padding:2px}
.bpm .v{font-family:var(--f-chord);font-weight:700;font-size:26px;min-width:46px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.bpm .v small{display:block;font-family:var(--f-head);font-size:8.5px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.bpm .ib{min-width:34px;font-size:22px}
.grv{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.grv select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font-weight:700;font-size:14.5px;padding:0;min-width:0;width:100%;text-overflow:ellipsis}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--now)}
.dots i.on.one{background:var(--accent)}
.count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40;font-family:var(--f-chord);font-weight:700;font-size:160px;color:var(--accent);opacity:0;transition:opacity .08s}
.count.show{opacity:.9}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,20,.55);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:86%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding-block:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-head);font-size:20px;margin:0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:7px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:3px}
.seg button{height:32px;padding:0 12px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--deep)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--violet)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.opt input[type=range]{width:160px;accent-color:var(--accent)}

/* editor */
.form{display:flex;flex-direction:column;gap:14px;padding-block:16px 60px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-family:var(--f-head);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--deep);padding:0 12px;font-size:16px;width:100%}
.fld textarea.code{font-family:var(--f-mono);font-size:14px;min-height:280px;white-space:pre;overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.help{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px;line-height:1.55}
.impbox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface2)}.impbox .it{display:flex;flex-direction:column;gap:2px;min-width:0}.impbox .it b{font-family:var(--f-head);font-size:15px}.impbox .it span{font-size:13px;color:var(--muted);line-height:1.4}.impbox .btn{flex:none;cursor:pointer}.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.help code{font-family:var(--f-mono);font-size:12.5px;color:var(--fg)}
.err{color:var(--danger);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--deep);padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.35);white-space:nowrap}

/* search */
.search{position:relative;margin:2px 0 8px}
.search input{width:100%;height:48px;border-radius:999px;border:1.5px solid var(--line);background:var(--deep);color:var(--fg);padding:0 46px 0 44px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent)}
.search .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search .sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.search .sx svg{width:16px;height:16px}
.noresult{padding:18px 2px;color:var(--muted)}
.setlist .loopdot{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 7px;vertical-align:2px}
/* loop celebration */
.party-glow{position:fixed;inset:0;z-index:90;pointer-events:none;border-radius:42px;padding:12px;overflow:hidden;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:pg-fade 2.6s ease forwards}
.party-glow i{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:conic-gradient(from 0deg,#7cc4f5,#a78bfa,#f59ac0,#ffc46b,#7fdcb0,#7cc4f5);filter:blur(10px);animation:pg-spin 2.6s linear forwards}
@keyframes pg-spin{to{transform:rotate(360deg)}}
@keyframes pg-fade{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
.party-pill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:92;pointer-events:none;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 22px;border-radius:22px;text-align:center;
  background:linear-gradient(140deg,#6a4bd8,var(--brand) 45%,var(--violet));color:#fff;box-shadow:0 12px 40px rgba(124,92,230,.55);
  animation:pp 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
.party-pill b{font-family:var(--f-head);font-size:19px;letter-spacing:.01em;white-space:nowrap}
.party-pill span{font-family:var(--f-chord);font-size:22px;font-weight:600;letter-spacing:.04em;opacity:.95}
@keyframes pp{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.95) translateY(-8px)}}
.party-canvas{position:fixed;inset:0;z-index:91;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (prefers-reduced-motion: reduce){.party-glow i{animation:none}}
@media (min-width:640px){
  .bar{min-height:76px}
  .bar[data-n="1"] .ch{font-size:40px}
  .bar[data-n="2"] .ch{font-size:31px}
  .bar[data-n="3"] .ch{font-size:23px}
  .bar[data-n="4"] .ch{font-size:19px}
  .bar[data-n="1"] .ch.long{font-size:34px}
  .bar[data-n="2"] .ch.long{font-size:26px}
}

/* proposta C: riquadro scuro con una luce viola nell'angolo; gli artisti in lilla, come una firma */
.hero{background:radial-gradient(70% 90% at 100% 0%,rgba(124,92,230,.45),transparent 60%),radial-gradient(50% 60% at 0% 100%,rgba(167,139,250,.18),transparent 70%),linear-gradient(160deg,#1a2141,#0e1328);box-shadow:inset 0 0 0 1px rgba(196,181,253,.14)}
.hero .tagline{color:#c4b5fd;padding-bottom:6px;border-bottom:1.5px solid rgba(167,139,250,.6)}
.mark{background:linear-gradient(160deg,#1a2141,#0e1328);box-shadow:inset 0 0 0 1px rgba(196,181,253,.3)}
.eyebrow{color:#c4b5fd}
.setlist .sa{color:#b9a9f5}
.setlist .n{color:#7c6fb0}

:root{
  --bg:#141a33; --deep:#0e1328; --surface:#1a2141; --surface2:#222a4a; --line:#323b66;
  --fg:#f3f0fb; --muted:#a6a9c8; --accent:#ffbf73; --accent-ink:#0e1328; --violet:#a78bfa; --brand:#7c5ce6; --danger:#ff8a8a;
  --sec-intro:#a6a9c8; --sec-verse:#7cc4f5; --sec-pre:#c4b5fd; --sec-chorus:#ffc46b; --sec-bridge:#7fdcb0; --sec-solo:#f59ac0; --sec-outro:#a6a9c8;
  --now:#ffc46b;
  --f-chord:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-head:"Josefin Sans","Century Gothic",system-ui,sans-serif;
  --f-ui:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}

/* hero */
.hero{margin-top:14px;border-radius:22px;padding:30px 20px 24px;background:
  radial-gradient(110% 85% at 85% 8%,rgba(196,181,253,.35),transparent 55%),
  linear-gradient(145deg,#231c5e 0%,#3a2a9a 42%,#5a40cc 78%,#7a5ee6 100%);
  display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
.hero img{width:min(300px,80%);height:auto;display:block;filter:drop-shadow(0 6px 22px rgba(255,170,80,.28))}
.hero .tagline{font-family:var(--f-head);font-weight:600;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c4b5fd}
.hero .newbtn{position:absolute;top:12px;right:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,19,40,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:58px;padding-block:6px}
.mark{width:38px;height:38px;border-radius:11px;flex:0 0 auto;background:linear-gradient(145deg,#2b2370,#5a40cc);display:flex;align-items:center;justify-content:center}
.mark img{width:24px;height:auto;display:block}
.top .ttl{flex:1;min-width:0}
.top .ttl .t{font-family:var(--f-head);font-weight:700;font-size:18px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.top .ttl .a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:38px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);font-weight:600;font-size:14px;padding:0 6px;gap:6px}
.ib:active{background:var(--surface2)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{min-height:40px;border-radius:999px;padding:0 16px;font-weight:700;font-size:15px;background:var(--surface2);border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.white{background:#fff;color:#3b2596;border-color:transparent}
.btn.warn{color:var(--danger)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13.5px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* setlist */
.eyebrow{font-family:var(--f-head);font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.setlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.setlist li{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.setlist .n{font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--muted);width:22px;text-align:right;font-variant-numeric:tabular-nums}
.setlist .main{flex:1;min-width:0;text-align:left}
.setlist .st{font-weight:700;font-size:17px;line-height:1.25}
.setlist .sa{font-size:14px;color:var(--muted)}
.keypill{font-family:var(--f-chord);font-weight:700;font-size:21px;min-width:52px;height:38px;padding:0 8px;border-radius:10px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center}
.keypill.moved{background:var(--accent);color:var(--accent-ink)}
.meta{font-size:12px;max-width:92px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
.reorder{display:flex;flex-direction:column}
.reorder .ib{height:30px;min-width:34px}
.listhead{margin-block:22px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.foot{display:flex;gap:10px;flex-wrap:wrap;padding-block:22px 10px}
.small{font-size:13px;color:var(--muted)}

/* song view */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--surface2);padding:3px;border-radius:999px;margin-block:12px 12px}
.tabs button{height:36px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--deep)}
.keybar{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.keybar .lab{font-size:11px;font-family:var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.keybar .lab b{display:block;font-family:var(--f-chord);font-size:28px;letter-spacing:0;color:var(--fg);line-height:1;text-transform:none}
.keys{display:flex;gap:6px;overflow-x:auto;padding-block:6px;scrollbar-width:none;flex:1;min-width:0;-webkit-overflow-scrolling:touch}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:46px;height:40px;border-radius:10px;border:1.5px solid var(--line);font-family:var(--f-chord);font-weight:600;font-size:19px;position:relative}
.keys button.orig::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--muted)}
.keys button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.keys button[aria-pressed="true"]::after{background:var(--accent-ink)}
.shiftinfo{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shiftinfo .sep{opacity:.5}

.sec{margin-block:14px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 24%,var(--line));overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;text-align:left}
.tag{font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--c);text-transform:uppercase}
.rep{font-family:var(--f-chord);font-weight:700;font-size:15px;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.pass{font-family:var(--f-chord);font-weight:700;font-size:15px;color:var(--now)}
.sec-h .sp{flex:1}
.lyr-hint{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.lyr-hint .dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.lyr-hint svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.sec.open .lyr-hint svg{transform:rotate(180deg)}
.rowsw{display:grid;gap:6px;padding:2px 8px 12px}
.rowsw:empty{display:none}
.sec:has(.rowsw:empty) .sec-h{padding-bottom:4px}
.sec:has(.rowsw:empty) .snote,.sec:has(.rowsw:empty) .cue{padding-bottom:10px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.bar{min-height:62px;border-right:2px solid rgba(243,240,251,.55);display:flex;align-items:center;justify-content:space-around;gap:2px;padding:0 3px;position:relative;border-radius:2px;min-width:0}
.bar.lb{border-left:2px solid rgba(243,240,251,.55)}
.bar.blank{border:0!important;background:none}
.bar.blank.editable{outline:1px dashed var(--line);outline-offset:-6px}
.volta{position:absolute;top:3px;left:5px;right:8px;height:13px;border-top:1.5px solid var(--muted);border-left:1.5px solid var(--muted);font-family:var(--f-ui);font-size:11px;font-weight:700;line-height:13px;padding-left:3px;color:var(--muted)}
.pct2{position:absolute;right:-17px;top:50%;transform:translateY(-50%);width:32px;z-index:1}
.pct2 svg{width:32px;height:24px;display:block;fill:var(--muted);stroke:var(--muted);stroke-width:3.2;stroke-linecap:round}
.cue{padding:0 14px 8px;font-size:15.5px;font-style:italic;color:var(--fg);opacity:.88;line-height:1.35}
.bar.first{border-left-width:4px!important}
.bar.now{background:color-mix(in srgb,var(--now) 24%,transparent)}
.bar.now::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--now);border-radius:2px}
.ch{font-family:var(--f-chord);font-weight:600;line-height:1;white-space:nowrap;display:inline-flex;align-items:baseline;min-width:0}
.ch .r{font-weight:700}
.ch .acc{font-size:.62em;position:relative;top:-.55em;margin-left:1px}
.ch .q{font-size:.6em;position:relative;top:-.62em;margin-left:1px;font-weight:600}
.ch.long{letter-spacing:-.02em}
.ch.long .q{font-size:.52em}
.ch .b{font-size:.64em;margin-left:1px;color:var(--muted);font-weight:600}
.bar[data-n="1"] .ch{font-size:30px}
.bar[data-n="2"] .ch{font-size:23px}
.bar[data-n="3"] .ch{font-size:17px}
.bar[data-n="4"] .ch{font-size:15px}
.bar[data-n="1"] .ch.long{font-size:25px}
.bar[data-n="2"] .ch.long{font-size:18px}
.bar .pct{font-family:var(--f-chord);font-size:28px;color:var(--muted);font-weight:600}
.nc{font-family:var(--f-chord);font-weight:600;font-size:18px;color:var(--muted)}
.lyr{border-top:1px solid color-mix(in srgb,var(--c) 22%,var(--line));padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.lyr .txt{white-space:pre-wrap;font-size:19px;line-height:1.5;max-width:65ch}
.lyr .empty{color:var(--muted);font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lyr textarea,.fld textarea{width:100%;min-height:120px;border-radius:12px;border:1.5px solid var(--line);background:var(--deep);padding:10px 12px;font-size:16px;line-height:1.45;resize:vertical}
.fulllyr{padding-block:6px 30px;display:flex;flex-direction:column;gap:14px}
.fulllyr .txt{white-space:pre-wrap;font-size:20px;line-height:1.55;max-width:65ch}
.emptybox{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.songnotes{font-size:15px;color:var(--fg);margin-top:8px;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;line-height:1.5}
.songnotes .lbl{margin-bottom:6px}
.pad-bottom{height:calc(120px + env(safe-area-inset-bottom,0px))}

.sec-h .fromhere{width:34px;height:34px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 40%,var(--line));color:var(--c);display:inline-flex;align-items:center;justify-content:center}
.sec-h .fromhere svg{width:13px;height:13px}
.snote{margin:0 14px 8px;font-size:13.5px;font-weight:700;color:var(--c);display:flex;gap:6px;align-items:baseline}
.snote::before{content:"♪";opacity:.8}
.formv{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.fstep{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--c) 26%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.fnum{font-family:var(--f-chord);font-weight:700;font-size:20px;color:var(--muted);min-width:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.fbody{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.fhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fbars{font-size:12.5px;color:var(--muted);margin-left:auto}
.fcue{font-style:italic;font-size:16px;line-height:1.35}
.fnote{font-size:14px;font-weight:700;color:var(--c)}
.fnote::before{content:"♪ ";opacity:.8}
/* listen */
.listen{display:flex;flex-direction:column;gap:14px;padding-block:4px 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-family:var(--f-head);font-size:15px;font-weight:600;letter-spacing:.02em}
.card p{margin:0}
.linkline{font-size:13px;color:var(--muted);word-break:break-all}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--deep);padding:0 14px;font-size:16px}
.player{display:flex;align-items:center;gap:12px}
.pbtn{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pbtn svg{width:22px;height:22px;fill:currentColor}
.ptrack{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ptrack input[type=range]{width:100%;accent-color:var(--accent)}
.ptime{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* publish bar (editor only) */
.pubbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--fg);color:var(--deep);border-radius:16px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 8px 28px rgba(0,0,0,.4);font-size:14px;max-width:836px;margin:0 auto}
.pubbar .btn{background:transparent;border-color:rgba(14,19,40,.25);color:var(--deep)}
.pubbar .btn.pri{background:var(--brand);color:#fff;border-color:transparent}
.listen-hero{align-items:center;text-align:center;padding:28px 16px}
.lh-t{font-family:var(--f-head);font-weight:700;font-size:22px}
.btn.big{min-height:54px;font-size:17px;padding:0 26px}
/* visual chart editor */
.edbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1.5px solid var(--accent);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.linkt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1.5px solid color-mix(in srgb,var(--accent) 40%,var(--line));font-size:14px;line-height:1.3}
.linkt .box{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink);font-size:14px}
.linkt[aria-pressed="true"] .box{background:var(--accent)}
.linkt[aria-pressed="false"]{background:none;opacity:.8}
.loopbox{flex-basis:100%;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.loopbox input{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--deep);padding:0 12px;font-family:var(--f-chord);font-size:24px;font-weight:600;width:100%}
.bar.editable{cursor:pointer}
.bar.editable:active{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.bar.sel{outline:2px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.addsec{width:100%;border:1.5px dashed var(--line);border-radius:14px;min-height:48px;color:var(--muted);font-weight:700;margin-top:6px}
.sheet.edsheet{max-height:58%;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.sheet.edsheet .wrap{gap:10px;padding-block:12px}

.bar.editable{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bar.msel{outline:2px dashed var(--accent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 22%,transparent)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:52;background:var(--surface);border-top:1.5px solid var(--accent);box-shadow:0 -10px 30px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
.selbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px}
.trask{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.wrapnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.sheet.edsheet{max-height:48%}
@media (min-width:900px),(orientation:landscape) and (min-width:640px){
 .sheet.edsheet{left:auto;top:0;bottom:0;width:min(400px,40vw);max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.45)}
 .sheet.edsheet .wrap{max-width:none;padding-inline:16px}
 body.edside #app{padding-right:min(400px,40vw)}
 body.edside .transport{right:min(400px,40vw)}body.edside .pubbar{right:calc(min(400px,40vw) + 12px)}
}
.shead{display:flex;align-items:center;gap:6px}
.shead .stitle{flex:1;min-width:0}
.lbl{font-family:var(--f-head);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pick button,.qual button{height:40px;border-radius:10px;border:1.5px solid var(--line);font-family:var(--f-chord);font-weight:600;font-size:19px}
.qual{display:flex;flex-wrap:wrap;gap:6px}
.qual button{padding:0 10px;min-width:48px;font-size:17px}
.qual.txt button{font-family:var(--f-head);font-size:12px;letter-spacing:.06em;height:36px}
.pick button[aria-pressed="true"],.qual button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipc{min-width:68px;height:52px;border-radius:12px;border:1.5px solid var(--line);font-family:var(--f-chord);font-size:26px;font-weight:700;padding:0 12px;display:inline-flex;align-items:center;justify-content:center}
.chipc .ch{font-size:26px}
.chipc[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
.chipc.add{color:var(--muted);border-style:dashed;min-width:52px}
/* transport */
.transport{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--deep);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.transport .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.play{width:56px;height:56px;border-radius:50%;background:linear-gradient(140deg,var(--brand),var(--violet));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.play svg{width:24px;height:24px;fill:currentColor}
.bpm{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:14px;padding:2px}
.bpm .v{font-family:var(--f-chord);font-weight:700;font-size:26px;min-width:46px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.bpm .v small{display:block;font-family:var(--f-head);font-size:8.5px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.bpm .ib{min-width:34px;font-size:22px}
.grv{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.grv select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font-weight:700;font-size:14.5px;padding:0;min-width:0;width:100%;text-overflow:ellipsis}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--now)}
.dots i.on.one{background:var(--accent)}
.count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40;font-family:var(--f-chord);font-weight:700;font-size:160px;color:var(--accent);opacity:0;transition:opacity .08s}
.count.show{opacity:.9}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,20,.55);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:86%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{padding-block:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-head);font-size:20px;margin:0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:7px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:3px}
.seg button{height:32px;padding:0 12px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--deep)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--violet)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.opt input[type=range]{width:160px;accent-color:var(--accent)}

/* editor */
.form{display:flex;flex-direction:column;gap:14px;padding-block:16px 60px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-family:var(--f-head);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--deep);padding:0 12px;font-size:16px;width:100%}
.fld textarea.code{font-family:var(--f-mono);font-size:14px;min-height:280px;white-space:pre;overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.help{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px;line-height:1.55}
.impbox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface2)}.impbox .it{display:flex;flex-direction:column;gap:2px;min-width:0}.impbox .it b{font-family:var(--f-head);font-size:15px}.impbox .it span{font-size:13px;color:var(--muted);line-height:1.4}.impbox .btn{flex:none;cursor:pointer}.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.help code{font-family:var(--f-mono);font-size:12.5px;color:var(--fg)}
.err{color:var(--danger);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--deep);padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.35);white-space:nowrap}

/* search */
.search{position:relative;margin:2px 0 8px}
.search input{width:100%;height:48px;border-radius:999px;border:1.5px solid var(--line);background:var(--deep);color:var(--fg);padding:0 46px 0 44px;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent)}
.search .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search .sx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.search .sx svg{width:16px;height:16px}
.noresult{padding:18px 2px;color:var(--muted)}
.setlist .loopdot{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 7px;vertical-align:2px}
/* loop celebration */
.party-glow{position:fixed;inset:0;z-index:90;pointer-events:none;border-radius:42px;padding:12px;overflow:hidden;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:pg-fade 2.6s ease forwards}
.party-glow i{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:conic-gradient(from 0deg,#7cc4f5,#a78bfa,#f59ac0,#ffc46b,#7fdcb0,#7cc4f5);filter:blur(10px);animation:pg-spin 2.6s linear forwards}
@keyframes pg-spin{to{transform:rotate(360deg)}}
@keyframes pg-fade{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
.party-pill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:92;pointer-events:none;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 22px;border-radius:22px;text-align:center;
  background:linear-gradient(140deg,#6a4bd8,var(--brand) 45%,var(--violet));color:#fff;box-shadow:0 12px 40px rgba(124,92,230,.55);
  animation:pp 2.6s cubic-bezier(.2,1.4,.4,1) forwards}
.party-pill b{font-family:var(--f-head);font-size:19px;letter-spacing:.01em;white-space:nowrap}
.party-pill span{font-family:var(--f-chord);font-size:22px;font-weight:600;letter-spacing:.04em;opacity:.95}
@keyframes pp{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.95) translateY(-8px)}}
.party-canvas{position:fixed;inset:0;z-index:91;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (prefers-reduced-motion: reduce){.party-glow i{animation:none}}
@media (min-width:640px){
  .bar{min-height:76px}
  .bar[data-n="1"] .ch{font-size:40px}
  .bar[data-n="2"] .ch{font-size:31px}
  .bar[data-n="3"] .ch{font-size:23px}
  .bar[data-n="4"] .ch{font-size:19px}
  .bar[data-n="1"] .ch.long{font-size:34px}
  .bar[data-n="2"] .ch.long{font-size:26px}
}

/* proposta C: riquadro scuro con una luce viola nell'angolo; gli artisti in lilla, come una firma */
.hero{background:radial-gradient(70% 90% at 100% 0%,rgba(124,92,230,.45),transparent 60%),radial-gradient(50% 60% at 0% 100%,rgba(167,139,250,.18),transparent 70%),linear-gradient(160deg,#1a2141,#0e1328);box-shadow:inset 0 0 0 1px rgba(196,181,253,.14)}
.hero .tagline{color:#c4b5fd;padding-bottom:6px;border-bottom:1.5px solid rgba(167,139,250,.6)}
.mark{background:linear-gradient(160deg,#1a2141,#0e1328);box-shadow:inset 0 0 0 1px rgba(196,181,253,.3)}
.eyebrow{color:#c4b5fd}
.setlist .sa{color:#b9a9f5}
.setlist .n{color:#7c6fb0}
</style>

function isBlank(b){return !b||(b.length===1&&b[0]==='_')}
const SPECIAL=['%','%%','-','_'];
function secType(lab){const words=lab.split(/[^A-Z0-9-]+/).filter(Boolean);for(const w of words){if(w==='V')return'verse';if(w==='C')return'chorus';if(w==='IN')return'intro';const t=TYPES.find(([,re])=>re.test(w));if(t)return t[0]}return'other'}
function parseChart(txt){
  const secs=[];let cur=null;
  const mk=(lab,rep)=>{cur={label:lab,type:secType(lab),repeat:rep,rows:[],bars:[],cue:'',note:''};secs.push(cur)};
  for(const raw of (txt||'').split('\n')){
    const l=raw.trim();if(!l||l.startsWith('#'))continue;
    const m=/^\[(.+)\]$/.exec(l);
    if(m){let lab=m[1].trim(),rep=1;const r=/\s*[x×]\s*(\d+)\s*$/i.exec(lab);if(r){rep=Math.max(1,+r[1]);lab=lab.slice(0,r.index).trim()}mk(lab.toUpperCase(),rep);continue}
    if(!cur)mk('',1);
    if(l.startsWith('>')){cur.cue=l.slice(1).trim();continue}
    if(l.startsWith('!')){cur.note=l.slice(1).trim();continue}
    const row=l.split('|').map(x=>x.trim()).filter(Boolean).map(cell=>{let t=cell.split(/\s+/);if(/^[12]\.$/.test(t[0])&&t.length>1)t=[t[0]+t[1],...t.slice(2)];return t});
    if(row.length){cur.rows.push(row);row.forEach(b=>cur.bars.push(b))}
  }
  return secs;
}

const PENDING=[];

/* ============ state + storage ============
   The shared setlist is embedded in the page (#setlist-data). The owner edits a local draft
   and publishes it as a new page version; everyone else reads the published setlist. */
const DRAFT='lkb-draft-v2',OLD=['lkb-charts-v1','lkp-charts-v1'],VIEWER='lkb-viewer-v2';
let PUBLISHED=[];
let PUB_REV=0;
try{const d=JSON.parse(document.getElementById('setlist-data').textContent);if(Array.isArray(d.songs))PUBLISHED=d.songs;PUB_REV=d.rev||0}catch(e){}
if(!PUBLISHED.length)PUBLISHED=JSON.parse(JSON.stringify(DEMO));
let S={songs:JSON.parse(JSON.stringify(PUBLISHED)),settings:{notation:'std',sound:'drums',countIn:true,fill:true,loop:false,follow:true,vol:.85,party:'both'}};
sortAZ();
let EDITOR=false,ART=null,publishing=false;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* viewer prefs: settings + personal key/tempo/groove overrides */
(function(){const v=lsGet(VIEWER);if(v){Object.assign(S.settings,v.settings||{});applyOverrides(v.over||{})}})();
function applyOverrides(over){S.songs.forEach(s=>{const o=over[s.id];if(o){['transpose','bpm','groove'].forEach(k=>{if(o[k]!==undefined)s[k]=o[k]})}})}
function unpublished(){return EDITOR&&JSON.stringify(S.songs)!==JSON.stringify(PUBLISHED)}
function save(){
  if(EDITOR){lsSet(DRAFT,{songs:S.songs,rev:PUB_REV});updBanner()}
  const over={};if(!EDITOR)S.songs.forEach(s=>{const p=PUBLISHED.find(x=>x.id===s.id);if(p){const o={};['transpose','bpm','groove'].forEach(k=>{if(s[k]!==p[k])o[k]=s[k]});if(Object.keys(o).length)over[s.id]=o}});
  const prev=lsGet(VIEWER)||{};lsSet(VIEWER,{settings:S.settings,over:EDITOR?(prev.over||{}):over});
}
async function detectEditor(){
  const HOST=window.LKB_HOST;
  if(!HOST&&(!window.claude||!window.claude.use))return;
  try{
    if(HOST){ART={host:true};EDITOR=true}else{
    const [art,user]=await Promise.all([claude.use('artifact'),claude.use('user')]);
    if(!art||!user)return;
    if(!(await user.canEdit()))return;
    ART=art;EDITOR=true}
    let d=lsGet(DRAFT);
    if(!d)for(const k of OLD){const o=lsGet(k);if(o&&Array.isArray(o.songs)){d={songs:o.songs};break}}
    if(d&&(d.rev||0)!==PUB_REV){lsSet('lkb-draft-backup',d);d=null}
    if(d&&Array.isArray(d.songs)&&d.songs.length){S.songs=d.songs;PUBLISHED.forEach(p=>{if(!S.songs.some(x=>x.id===p.id))S.songs.push(JSON.parse(JSON.stringify(p)))})}
    else S.songs=JSON.parse(JSON.stringify(PUBLISHED));
    const UPG={"i-will-survive": {"from": "[VERSE/CHORUS]\n! Same loop for verse and chorus\n| Am7 | Dm7 | G | Cmaj7 |\n| Fmaj7 | Dm/B | Esus | E |", "song": {"chart": "[INTRO]\n! First time round: piano only\n[VERSE/CHORUS]\n! Same loop for verse and chorus\n| Am7 | Dm7 | G | Cmaj7 |\n| Fmaj7 | Dm/B | Esus | E |\n[CODA]\n! Slow break, then faster and faster to the end", "notes": ""}}};let upg=false;S.songs=S.songs.map(x=>{const u=UPG[x.id];if(u&&x.chart===u.from){upg=true;return Object.assign({},x,{chart:u.song.chart,notes:u.song.notes})}return x});if(upg)lsSet(DRAFT,{songs:S.songs,rev:PUB_REV});
    const seen=lsGet('lkb-pending-seen')||[];let added=false;PENDING.forEach(p=>{if(!seen.includes(p.id)&&!S.songs.some(x=>x.id===p.id)){S.songs.push(JSON.parse(JSON.stringify(p)));seen.push(p.id);added=true}});lsSet('lkb-pending-seen',seen);sortAZ();if(added)lsSet(DRAFT,{songs:S.songs,rev:PUB_REV});
    render();
  }catch(e){}
}
function updBanner(){
  let b=document.getElementById('pubbar');
  if(!unpublished()){if(b)b.remove();document.body.classList.remove('has-pub');return}
  if(!b){document.body.insertAdjacentHTML('beforeend','<div class="pubbar" id="pubbar"></div>');b=document.getElementById('pubbar')}
  document.body.classList.add('has-pub');
  b.innerHTML=`<span><b>Changes not shared yet.</b> The band sees the last published setlist.</span><span class="row"><button class="btn sm" data-act="discard">${view.confirmDiscard?'Tap again to discard':'Discard'}</button><button class="btn sm pri" data-act="publish">${publishing?'Publishing…':'Publish for the band'}</button></span>`;
}
function mainJs(){const el=document.getElementById('main-js');if(el)return el.textContent;
  for(const sc of document.querySelectorAll('script:not([src])')){const t=sc.textContent;if(t.indexOf('function pageDoc(')>=0&&t.indexOf('const SAMPLES=')>=0)return t}
  throw new Error('page source not found')}
function pageDoc(songs){
  const reset=(document.head.querySelector('style')||{}).textContent||'';
  const json=JSON.stringify({rev:PUB_REV,songs}).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +document.getElementById('tpl-head').textContent
    +'<script type="application/json" id="setlist-data">'+json+'<\/script>'
    +'<script type="text/plain" id="tpl-head">'+document.getElementById('tpl-head').textContent+'<\/script>'
    +'<script id="main-js">'+mainJs()+'<\/script></body></html>';
}
/* ===== web version: publish straight to GitHub (host) + live updates (everyone) ===== */
const GH={owner:'PaoloRubinacci',repo:'livekaraokeparis',path:'band-data.json',branch:'main'},TOKKEY='lkb-gh-token';
function ghToken(){try{return localStorage.getItem(TOKKEY)||''}catch(e){return ''}}
function ghApi(method,url,body,tok){return fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+url,{method,cache:'no-store',
  headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+tok},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})}
function askToken(){return new Promise(res=>{
  const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:90;background:rgba(8,10,25,.78);display:flex;align-items:center;justify-content:center;padding:16px';
  o.innerHTML=`<div class="card" style="max-width:420px;width:100%"><h3>Connect GitHub</h3><p class="small">Paste your GitHub key for <b>livekaraokeparis</b>. You only do this once on this phone; it stays here.</p><input id="ghtok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" style="height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--deep);padding:0 12px;font-size:16px;width:100%"><div class="row"><button class="btn" id="ghc">Cancel</button><button class="btn pri" id="ghs">Save</button></div><div id="gherr" class="small" style="color:var(--danger)"></div></div>`;
  document.body.appendChild(o);
  o.querySelector('#ghc').onclick=()=>{o.remove();res('')};
  o.querySelector('#ghs').onclick=async()=>{const t=o.querySelector('#ghtok').value.trim();if(!t)return;o.querySelector('#gherr').textContent='Checking…';
    const r=await ghApi('GET','',null,t).catch(()=>null);
    if(!r||!r.ok){o.querySelector('#gherr').textContent='This key does not open livekaraokeparis. Check it and try again.';return}
    try{localStorage.setItem(TOKKEY,t)}catch(e){}o.remove();res(t)};
})}
function longToast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
async function ghPublish(){
  const H=window.LKB_HOST;let tok=ghToken();
  if(!tok){tok=await askToken();if(!tok)return}
  publishing=true;updBanner();
  try{
    let r=await ghApi('GET','/contents/'+GH.path+'?ref='+GH.branch,null,tok),sha;
    if(r.status===401){try{localStorage.removeItem(TOKKEY)}catch(e){}throw{msg:'GitHub key not valid any more. Tap Publish to enter it again.'}}
    if(r.ok){const j=await r.json();sha=j.sha;let cur=null;try{cur=JSON.parse(atob((j.content||'').replace(/\s/g,'')))}catch(e){}
      if(cur&&(cur.rev||0)>PUB_REV)throw{msg:'A newer version was published from another phone. Your changes are kept here: copy them after reloading.'}}
    else if(r.status!==404)throw{msg:'GitHub error '+r.status+'. Try again.'};
    const rev=PUB_REV+1,dj=JSON.stringify({rev,songs:S.songs});
    const [b,h]=await Promise.all([H.enc(H.bandPw,dj),H.enc(H.hostPw,JSON.stringify({role:'host',bandPw:H.bandPw,hostPw:H.hostPw,data:dj}))]);
    const body={message:'Band charts: update (rev '+rev+')',content:btoa(JSON.stringify({rev,band:b,host:h})),branch:GH.branch};if(sha)body.sha=sha;
    r=await ghApi('PUT','/contents/'+GH.path,body,tok);
    if(r.status===401){try{localStorage.removeItem(TOKKEY)}catch(e){}throw{msg:'GitHub key not valid any more. Tap Publish to enter it again.'}}
    if(r.status===403||r.status===404)throw{msg:'This GitHub key cannot write to livekaraokeparis (it needs Contents: read and write).'};
    if(r.status===409||r.status===422)throw{msg:'Someone published at the same time. Reload and try again.'};
    if(!r.ok)throw{msg:'GitHub error '+r.status+'. Try again.'};
    PUB_REV=rev;PUBLISHED=JSON.parse(JSON.stringify(S.songs));try{localStorage.removeItem(DRAFT)}catch(e){}
    publishing=false;updBanner();render();longToast('Published. The band sees it in about a minute.');return;
  }catch(e){longToast(e&&e.msg||'Could not publish. Check the connection and try again.')}

function confetti(){
  const cv=document.createElement('canvas');cv.className='party-canvas';document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const cols=['#c4b5fd','#a78bfa','#7cc4f5','#ffc46b','#f59ac0','#7fdcb0','#ffffff'],P=[];
  [[0,1],[W,-1]].forEach(([sx,dir])=>{for(let i=0;i<70;i++){const a=(-62-Math.random()*22)*Math.PI/180,v=11+Math.random()*9;
    P.push({x:sx,y:H*0.92,vx:Math.cos(a)*v*dir,vy:Math.sin(a)*v,w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length],s:Math.random()*Math.PI})}});
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1000;x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.32;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.s+=.12;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.s));x.globalAlpha=Math.max(0,Math.min(1,(2.6-k)/0.6));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});

/* .mxl = zipped MusicXML */
async function unzipFirstXML(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let eocd=-1;
  for(let i=u.length-22;i>=0;i--)if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('zip');
  let p=dv.getUint32(eocd+16,true);const n=dv.getUint16(eocd+10,true);
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.slice(p+46,p+46+nl));p+=46+nl+el+cl;
    if(/^META-INF\//.test(name)||!/\.(xml|musicxml)$/i.test(name))continue;
    const ln=dv.getUint16(off+26,true),le=dv.getUint16(off+28,true),data=u.slice(off+30+ln+le,off+30+ln+le+csize);
    if(method===0)return new TextDecoder().decode(data);
    const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(ds).text();
  }
  throw new Error('zip');
}
async function songsFromFile(file){
  const name=(file.name||'').toLowerCase(),type=file.type||'';
  if(/\.pdf$/.test(name)||type==='application/pdf')throw new Error('pdf');
  if(/^image\//.test(type)||/\.(jpe?g|png|heic|gif|webp)$/.test(name))throw new Error('image');
  const buf=await file.arrayBuffer();const head=new Uint8Array(buf.slice(0,4));
  if(head[0]===0x50&&head[1]===0x4b){const x=await unzipFirstXML(buf);const s=parseMusicXML(x);return s?[s]:[]}
  if(head[0]===0x25&&head[1]===0x50&&head[2]===0x44&&head[3]===0x46)throw new Error('pdf');
  const txt=new TextDecoder().decode(buf);
  const ir=parseIreal(txt);if(ir&&ir.length)return ir;
  if(/<score-partwise|<score-timewise/.test(txt)){const s=parseMusicXML(txt);return s?[s]:[]}
  return[];
}

/* which spelling a section already uses (more flats than sharps -> flats); null when it has neither */
function secSpell(sec){let f=0,h=0;(sec&&sec.bars||[]).forEach(b=>b.forEach(t=>{const x=splitChord(stripEnd(t));if(x.nc||x.raw!==undefined)return;[x.a,x.bass&&x.bass.a].forEach(a=>{if(a==='b')f++;else if(a==='#')h++})}));return f>h?true:h>f?false:null}
function clipN(c){return c&&c.rows?c.rows.reduce((a,r)=>a+r.length,0):0}
function accTxt(n){return n.replace('#','♯').replace(/^([A-G])b$/,'$1♭')}
function barSheetHTML(){
  const s=song();if(!s||!view.sel)return'';const secs=parseChart(s.chart),x=view.sel,sec=secs[x.si],bar=sec&&sec.bars[x.bi];if(!bar)return'';

  <div class="chips">${chips}</div>

  <div class="small">1. = played only the first time. 2. = played instead of it the second time: put it on the bar that replaces it, also in the next section.</div>
  <div class="row"><button class="btn sm" data-act="bar-before">+ Bar before</button><button class="btn sm" data-act="bar-after">+ Bar after</button><button class="btn sm warn" data-act="bar-del">Delete bar</button></div>
  <div class="small">Tip: press and hold a bar to select several bars, then copy them.</div>`;
}
function secSheetHTML(){
  const s=song();if(!s)return'';const secs=parseChart(s.chart),i=view.edSec,sec=secs[i];if(!sec)return'';const p=splitLabel(sec.label),clip=lsClip();

  <div class="lbl">Name</div><div class="qual txt">${SEC_TYPES.map(t=>`<button data-stype="${t}" aria-pressed="${p.type===t}">${t}</button>`).join('')}</div>
  <div class="inrow"><input id="sec-name" value="" placeholder="Or type any name: A · VERSE, RAP, HORNS…" autocapitalize="characters"><button class="btn sm pri" data-act="sec-name">Set</button></div>

  <div class="row"><button class="btn sm" data-act="sec-up" ${i>0?'':'disabled style="opacity:.4"'}>Move up</button><button class="btn sm" data-act="sec-down" ${i<secs.length-1?'':'disabled style="opacity:.4"'}>Move down</button><button class="btn sm" data-act="sec-dup">Duplicate</button></div>
  <div class="lbl">Lyric cue (start of the section)</div>

  ${clip?`<div class="small">Copied: ${esc(clip.label)} (${clipN(clip)} bars${clip.song&&clip.song!==s.title?', from '+esc(clip.song):''})</div>`:''}
  ${others.length?`<div class="lbl">Same chords as</div><div class="qual txt">${others.map(o=>`<button data-sameas="${o.i}">${esc(o.label)}</button>`).join('')}</div>`:''}

  <div class="qual txt">${[-6,-5,-4,-3,-2,-1,1,2,3,4,5,6].map(n=>`<button data-act="sec-tr" data-n="${n}">${n>0?'+':'−'}${Math.abs(n)}</button>`).join('')}</div>

  <div class="opt"><span>Accidentals</span><span class="seg">${[['','Auto'],['b','♭'],['#','♯']].map(([v,l])=>`<button data-act="sec-ctr-sp" data-v="${v}" aria-pressed="${(view.ctrSp||'')===v}">${l}</button>`).join('')}</span></div>`:''}

/* ============ audio engine (drums) ============ */
const P={ctx:null,buf:{},master:null,playing:false,timer:null,next:0,step:0,counting:false,seq:[],pos:0,curBar:-1,q:[],raf:0,wake:null,silent:null};
function b64buf(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function decode(ab){return new Promise((res,rej)=>{try{const p=P.ctx.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej)}catch(e){rej(e)}})}
async function initCtx(){
  if(P.ctx)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{P.silent=new Audio(SILENT);P.silent.loop=true;P.silent.play().catch(()=>{})}catch(e){}
  P.ctx=new (window.AudioContext||window.webkitAudioContext)();
  P.master=P.ctx.createGain();P.master.gain.value=S.settings.vol;P.master.connect(P.ctx.destination);
}
async function initDrums(){await initCtx();if(Object.keys(P.buf).length)return;await Promise.all(Object.entries(SAMPLES).map(([k,b])=>decode(b64buf(b)).then(d=>P.buf[k]=d).catch(()=>{})))}
function hit(name,time,vel){const b=P.buf[name];if(!b)return;const s=P.ctx.createBufferSource(),g=P.ctx.createGain();s.buffer=b;g.gain.value=vel*(0.94+Math.random()*0.06);s.connect(g);g.connect(P.master);s.start(time)}
function buildSeq(){const s=song();P.seq=[];parseChart(s.chart).forEach((sec,si)=>{for(let p=1;p<=sec.repeat;p++)sec.bars.forEach((b,bi)=>{if(isBlank(b))return;const e=endingOf(b);if(sec.repeat>1&&((e===1&&p>1)||(e===2&&p===1)))return;P.seq.push({si,bi,pass:p,of:sec.repeat,last:false})})});P.seq.forEach((x,i)=>{const n=P.seq[i+1];x.last=!n||n.si!==x.si})}
async function startBeat(fromSec){
  stopAudio();await initDrums();if(P.ctx.state==='suspended')await P.ctx.resume();
  stopBeat(true);buildSeq();
  P.pos=Math.max(0,P.seq.findIndex(x=>x.si===fromSec));
  P.playing=true;P.step=0;P.counting=S.settings.countIn;P.next=P.ctx.currentTime+0.08;P.q=[];
  P.q.push({t:P.next,bar:P.counting?-1:P.pos,beat:0,count:P.counting?1:0});
  P.timer=setInterval(sched,25);sched();P.raf=requestAnimationFrame(draw);
  const pb=document.getElementById('playbtn');if(pb){pb.innerHTML=IC.stop;pb.setAttribute('aria-label','Stop beat')}
  try{if(navigator.wakeLock)P.wake=await navigator.wakeLock.request('screen')}catch(e){}
}
function stopBeat(quiet){
  if(!P.playing&&!quiet)return;
  P.playing=false;clearInterval(P.timer);cancelAnimationFrame(P.raf);P.q=[];
  markBar(-1);document.querySelectorAll('.pass').forEach(e=>e.textContent='');
  document.querySelectorAll('#dots i').forEach(e=>e.classList.remove('on'));
  const pb=document.getElementById('playbtn');if(pb){pb.innerHTML=IC.play;pb.setAttribute('aria-label','Start beat')}
  document.getElementById('count').classList.remove('show');
  try{P.wake&&P.wake.release();P.wake=null}catch(e){}
}
function sched(){
  const s=song();if(!s){stopBeat();return}
  while(P.next<P.ctx.currentTime+0.12&&P.playing){
    const g=GROOVES[s.groove]||GROOVES.pop,per=g.beats*g.spb,dur=60/s.bpm/g.spb;
    if(P.step>=per)P.step=0;
    playStep(g,P.step,P.next);
    P.next+=dur;P.step++;
    if(P.step%g.spb===0&&P.step<per)P.q.push({t:P.next,beat:P.step/g.spb,count:P.counting?P.step/g.spb+1:0});
    if(P.step>=per){P.step=0;
      if(P.counting){P.counting=false}
      else if(P.seq.length){P.pos++;if(P.pos>=P.seq.length){if(S.settings.loop)P.pos=0;else{hit('kick',P.next,1);hit('hat',P.next,.7);P.q.push({t:P.next,end:true});P.playing=false;break}}}
      P.q.push({t:P.next,bar:P.seq.length?P.pos:-1,beat:0,count:0});
    }
  }
}
function lev(ch){return ch==='X'?1:ch==='x'?.72:ch==='o'?.38:0}
function playStep(g,st,t){
  if(P.counting){if(st%g.spb===0)hit('hat',t,st===0?1:.75);return}
  if(S.settings.sound==='click'){if(st%g.spb===0)hit(st===0?'tom1':'hat',t,.8);return}
  const per=g.beats*g.spb,cur=P.seq[P.pos];
  const inFill=S.settings.fill&&cur&&cur.last&&P.pos<P.seq.length-1&&st>=per-g.spb;
  if(inFill){const k=st-(per-g.spb),toms=g.spb===4?['tom1','tom1','tom2','tom3']:g.spb===3?['tom1','tom2','tom3']:['tom2','tom3'];hit(toms[k],t,.85);if(k===0)hit('kick',t,.6);return}
  const v1=lev(g.hat[st]),v2=lev(g.kick[st]),v3=lev(g.snare[st]);
  if(v1)hit('hat',t,v1*.55);if(v2)hit('kick',t,v2);if(v3)hit('snare',t,v3*.85);
}
function draw(){
  const now=P.ctx.currentTime;
  while(P.q.length&&P.q[0].t<=now+0.01){const ev=P.q.shift();
    if(ev.end){stopBeat(true);return}
    if(ev.bar!==undefined)markBar(ev.bar);
    if(ev.beat!==undefined)document.querySelectorAll('#dots i').forEach((e,k)=>e.classList.toggle('on',k===ev.beat));
    const c=document.getElementById('count');if(ev.count){c.textContent=ev.count;c.classList.add('show')}else c.classList.remove('show');
  }
  if(P.playing||P.q.length)P.raf=requestAnimationFrame(draw);
}
function markBar(pos){
  P.curBar=pos;
  document.querySelectorAll('.bar.now').forEach(e=>e.classList.remove('now'));
  const x=P.seq[pos];if(pos<0||!x)return;
  const el=document.getElementById(`b-${x.si}-${x.bi}`);if(!el)return;el.classList.add('now');
  document.querySelectorAll('.pass').forEach(e=>e.textContent='');
  const pe=document.getElementById('p-'+x.si);if(pe&&x.of>1)pe.textContent=x.pass+'/'+x.of;
  if(S.settings.follow&&(x.bi===0||x.bi%4===0)){const r=el.getBoundingClientRect(),vh=window.innerHeight;if(r.top<90||r.bottom>vh-150)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
}

function stopAudio(){}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P.playing&&navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>P.wake=w).catch(()=>{})});

document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.bar){e.preventDefault();e.target.click()}});
/* browser Back button / swipe-back: an open song is one step in the browser history, so going back returns to the setlist (where you were in it) instead of leaving the page */
let listY=0;
try{history.scrollRestoration='manual'}catch(e){}
document.addEventListener('click',e=>{if(view.name==='list'&&e.target.closest&&e.target.closest('[data-open]'))listY=window.scrollY},true);
const renderBase=render;
render=function(){
  renderBase.apply(this,arguments);
  try{const want=view.name==='list'?0:1,have=(history.state&&history.state.lkb)||0;
    if(want>have)history.pushState({lkb:1},'');
    else if(want<have)history.back();
  }catch(e){}
};
window.addEventListener('popstate',()=>{
  try{
    if(view.name==='list')return;
    if(view.sheet){view.sheet=null;history.pushState({lkb:1},'');render();return}
    if(view.name==='edit'){history.pushState({lkb:1},'');toast('Tap Save or Cancel to leave the editor');return}
    stopBeat();stopAudio();view={...view,name:'list',id:null};render();
    const y=listY;window.scrollTo(0,y);requestAnimationFrame(()=>window.scrollTo(0,y));setTimeout(()=>window.scrollTo(0,y),60);
  }catch(e){}
});

render();
detectEditor();
</script>

#lock .lkg-band{background:#ffbf73;color:#0e1328;box-shadow:0 16px 36px -14px rgba(255,170,80,.75),inset 0 1px 0 rgba(255,255,255,.65)}
.lkg-band .lkg-arr{background:#0e1328;color:#ffbf73}
#lock .lkg-host{background:rgba(255,255,255,.04);color:#f3f0fb;box-shadow:inset 0 0 0 1.5px rgba(255,191,115,.55)}
.lkg-host .lkg-arr{background:rgba(255,191,115,.14);color:#ffbf73;box-shadow:inset 0 0 0 1.5px rgba(255,191,115,.45)}
#pwbox{display:none;flex-direction:column;gap:12px}
#rolelab{font:700 13px/1 Montserrat,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#ffbf73;margin-top:4px}
#pw{height:56px;border-radius:16px;border:1.5px solid #323b66;background:#0e1328;color:#f3f0fb;padding:0 18px;font:500 18px Montserrat,system-ui,sans-serif;text-align:center;letter-spacing:.08em;outline:none}
#pw:focus{border-color:#ffbf73;box-shadow:0 0 0 4px rgba(255,191,115,.15)}
#openbtn{height:56px;border-radius:999px;border:0;background:#ffbf73;color:#0e1328;font:700 19px/1 "Josefin Sans",system-ui,sans-serif;letter-spacing:.1em;padding-top:3px;cursor:pointer;box-shadow:0 14px 32px -14px rgba(255,170,80,.75)}
#openbtn:disabled{opacity:.6}
#backbtn{height:40px;border:0;background:none;color:#a6a9c8;font:500 14px Montserrat,system-ui,sans-serif;cursor:pointer}
#lerr{color:#ff8a8a;font-size:14px;min-height:20px}
#lock .lkg-card{background:radial-gradient(70% 90% at 100% 0%,rgba(124,92,230,.45),transparent 60%),radial-gradient(50% 60% at 0% 100%,rgba(167,139,250,.18),transparent 70%),linear-gradient(160deg,#1a2141,#0e1328)!important;box-shadow:inset 0 0 0 1px rgba(196,181,253,.14)!important}
</style>
