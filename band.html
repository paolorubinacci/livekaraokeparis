#roles{display:flex;flex-direction:column;gap:12px}
.lkg-btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:8px 8px 8px 24px;border-radius:999px;border:0;cursor:pointer;text-align:left;font:inherit;-webkit-tap-highlight-color:transparent;transition:transform .35s cubic-bezier(.34,1.3,.5,1),box-shadow .3s ease}
.lkg-btn .lkg-lbl{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
#lock .lkg-btn .lkg-lbl b{color:inherit;font:700 21px/1 "Josefin Sans",system-ui,sans-serif;letter-spacing:.08em;padding-top:3px}
#lock .lkg-btn .lkg-lbl small{text-transform:none;color:inherit;font:500 12px/1.2 Montserrat,system-ui,sans-serif;letter-spacing:.02em;opacity:.78}
.lkg-btn .lkg-arr{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;transition:transform .45s cubic-bezier(.34,1.3,.5,1)}
.lkg-btn .lkg-arr svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lkg-btn:active{transform:scale(.97)}
.lkg-btn:hover .lkg-arr,.lkg-btn:focus-visible .lkg-arr{transform:translateX(3px)}
.lkg-btn:focus-visible{outline:2px solid #ffbf73;outline-offset:3px}
#lock .lkg-band{background:#ffbf73;color:#0e1328;box-shadow:0 16px 36px -14px rgba(255,170,80,.75),inset 0 1px 0 rgba(255,255,255,.65)}
.lkg-band .lkg-arr{background:#0e1328;color:#ffbf73}
#lock .lkg-host{background:rgba(255,255,255,.04);color:#f3f0fb;box-shadow:inset 0 0 0 1.5px rgba(255,191,115,.55)}
.lkg-host .lkg-arr{background:rgba(255,191,115,.14);color:#ffbf73;box-shadow:inset 0 0 0 1.5px rgba(255,191,115,.45)}
#pwbox{display:none;flex-direction:column;gap:12px}
#rolelab{font:700 13px/1 Montserrat,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#ffbf73;margin-top:4px}
#pw{height:56px;border-radius:16px;border:1.5px solid #323b66;background:#0e1328;color:#f3f0fb;padding:0 18px;font:500 18px Montserrat,system-ui,sans-serif;text-align:center;letter-spacing:.08em;outline:none}
#pw:focus{border-color:#ffbf73;box-shadow:0 0 0 4px rgba(255,191,115,.15)}
#openbtn{height:56px;border-radius:999px;border:0;background:#ffbf73;color:#0e1328;font:700 19px/1 "Josefin Sans",system-ui,sans-serif;letter-spacing:.1em;padding-top:3px;cursor:pointer;box-shadow:0 14px 32px -14px rgba(255,170,80,.75)}
#openbtn:disabled{opacity:.6}
#backbtn{height:40px;border:0;background:none;color:#a6a9c8;font:500 14px Montserrat,system-ui,sans-serif;cursor:pointer}
#lerr{color:#ff8a8a;font-size:14px;min-height:20px}
#lock .lkg-card{background:radial-gradient(70% 90% at 100% 0%,rgba(124,92,230,.45),transparent 60%),radial-gradient(50% 60% at 0% 100%,rgba(167,139,250,.18),transparent 70%),linear-gradient(160deg,#1a2141,#0e1328)!important;box-shadow:inset 0 0 0 1px rgba(196,181,253,.14)!important}
</style>

<div id="roles">
<p class="lkg-hint">Who are you tonight?</p>
<button type="button" class="lkg-btn lkg-band" data-role="band"><span class="lkg-lbl"><b>BAND</b><small>Charts for the musicians</small></span><span class="lkg-arr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
<button type="button" class="lkg-btn lkg-host" data-role="host"><span class="lkg-lbl"><b>HOST</b><small>Edit and publish the setlist</small></span><span class="lkg-arr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span></button>
</div>
<div id="pwbox">
<div id="rolelab"></div>
<input id="pw" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password">
<button type="submit" id="openbtn">OPEN</button>
<button type="button" id="backbtn">← Back</button>
</div>
<div id="lerr"></div>
</form></div>
<script>
(function(){
const KEY='lkb-pw';
const remoteP=fetch('band-data.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
const eb=document.getElementById('enc-band');
const EMB={rev:+(eb.dataset.rev||0),band:eb.textContent.trim(),host:document.getElementById('enc-host').textContent.trim()};
function b2u(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function u2b(u){let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
async function key(pw,salt,use){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,[use])}
async function dec(blob,pw){const raw=b2u(blob);const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},await key(pw,salt,'decrypt'),ct);return new TextDecoder().decode(pt)}
async function enc(pw,txt){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt,'encrypt'),new TextEncoder().encode(txt)));
 const out=new Uint8Array(28+ct.length);out.set(salt,0);out.set(iv,16);out.set(ct,28);return u2b(out)}
function boot(txt){document.getElementById('setlist-data').textContent=txt;const src=document.getElementById('main-js').textContent;const s=document.createElement('script');s.textContent=src;document.body.appendChild(s);document.getElementById('lock').remove()}
let ROLE=null;
async function go(role,pw,silent){
 if(!pw)return;const btn=document.getElementById('openbtn');if(btn)btn.disabled=true;
 const R=await remoteP;const src=(R&&R.band&&R.host&&(R.rev||0)>=EMB.rev)?R:EMB;
 try{
  if(role==='band'){const t=await dec(src.band,pw);
   window.LKB_GATE={decode:async j=>dec(j.band,pw)};save(role,pw);boot(t);return}
  const h=JSON.parse(await dec(src.host,pw));
  window.LKB_HOST={bandPw:h.bandPw,hostPw:h.hostPw,enc};
  window.LKB_GATE={decode:async j=>JSON.parse(await dec(j.host,pw)).data};save(role,pw);boot(h.data);return
 }catch(e){}
 if(btn)btn.disabled=false;
 if(!silent)document.getElementById('lerr').textContent='Wrong password. Ask Paolo.';try{localStorage.removeItem(KEY)}catch(e){}}
function save(role,pw){try{localStorage.setItem(KEY,JSON.stringify({role,pw}))}catch(e){}}
function pick(role){ROLE=role;document.getElementById('roles').style.display='none';const b=document.getElementById('pwbox');b.style.display='flex';
 document.getElementById('rolelab').textContent=role==='band'?'Band password':'Host password';document.getElementById('lerr').textContent='';const i=document.getElementById('pw');i.value='';i.focus()}
document.querySelectorAll('#roles [data-role]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.role)));
document.getElementById('backbtn').addEventListener('click',()=>{ROLE=null;document.getElementById('pwbox').style.display='none';document.getElementById('roles').style.display='flex';document.getElementById('lerr').textContent=''});
document.getElementById('lockf').addEventListener('submit',e=>{e.preventDefault();if(ROLE)go(ROLE,document.getElementById('pw').value.trim(),false)});
let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(saved&&saved.role&&saved.pw)go(saved.role,saved.pw,true);
})();
</script></body></html>
